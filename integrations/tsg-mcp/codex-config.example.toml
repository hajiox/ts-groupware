# TSG Data MCP v1.1.0. Merge this section only. Keep the protected-key launcher
# and existing token unchanged when upgrading; replace only the adapter path.
[mcp_servers.tsg_data]
command = "node"
args = ["C:/tools/tsg-mcp/src/server.mjs"]
env_vars = ["TSG_DATA_API_TOKEN", "TSG_DATA_API_BASE_URL"]
startup_timeout_sec = 15
tool_timeout_sec = 45
enabled = true
